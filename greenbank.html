<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="title">Ottawa Chinese Soccer Club</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/ocs-logo.png" type="image/png">
</head>
<body>

    <header>
        <div><a href="index.html" class="logo-link">
        <img src="images/ocs-logo.png" alt="Ottawa Chinese Soccer Club Logo" class="header-logo">
        </a></div>
        <div class="logo" data-lang-key="club_name">Soccer Club</div>
        <nav class="main-nav">
            <button class="hamburger" id="hamburger-menu" aria-label="Menu">
                &#9776; <!-- Hamburger icon -->
            </button>
            <ul id="nav-links">
                <li><a href="index.html" data-lang-key="nav_home">Home</a></li>
                <li><a href="indoor.html" data-lang-key="nav_indoor">Indoor</a></li>
                <li><a href="outdoor.html" data-lang-key="nav_outdoor">Outdoor</a></li>
                <li><a href="bbq.html" data-lang-key="nav_bbq">BBQ</a></li>
                <li><a href="community.html" data-lang-key="nav_community">Community</a></li>
                <li><a href="contact.html" data-lang-key="nav_contact">Contact</a></li>
            </ul>
        </nav>
        <div class="language-switcher">
            <button id="lang-en">EN</button>
            <span>/</span>
            <button id="lang-zh">中文</button>
        </div>
    </header>

    <main>
        <div class="bbq-container">
            <aside class="side-nav">
                <h2>Years</h2>
                <ul>
                    <li><a href="bbq2025.html" class="button">2025</a></li>
                    <li><a href="bbq2024.html" class="button">2024</a></li>
                    <li><a href="bbq2023.html" class="button">2023</a></li>
                    <li><a href="greenbank.html" class="button active" data-lang-key="greenbank_button">Greenbank Reunion</a></li>
                </ul>
            </aside>
            <section id="greenbank" class="bbq-content">
                <h1 data-lang-key="greenbank_title">Greenbank Reunion</h1>

                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/hm5d38KTZyI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <h2 data-lang-key="greenbank_slideshow">Reunion Photo Gallery</h2>
                <div class="slideshow">
                    <img src="images/greenbank-reunion/reunion1.jpg" alt="Reunion photo 1">
                    <img src="images/greenbank-reunion/reunion2.jpg" alt="Reunion photo 2">
                    <img src="images/greenbank-reunion/reunion3.jpg" alt="Reunion photo 3">
                    <img src="images/greenbank-reunion/reunion4.jpg" alt="Reunion photo 4">
                    <img src="images/greenbank-reunion/reunion5.jpg" alt="Reunion photo 5">
                    <img src="images/greenbank-reunion/reunion6.jpg" alt="Reunion photo 6">
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Ottawa Chinese Soccer Club. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
